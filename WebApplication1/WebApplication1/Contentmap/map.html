<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <title>Leaflet Map</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        #map {
            width: 100%;
            height: 100vh;
        }

        .info {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1000;
            background: white;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Segoe UI', Arial, sans-serif;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            min-width: 200px;
        }

        .btn-save {
            margin-top: 10px;
            width: 100%;
            padding: 10px;
            background-color: #10B981;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

            .btn-save:hover {
                background-color: #059669;
            }
    </style>
</head>
<body>

    <div class="info">
        <div style="margin-bottom: 10px; color: #64748B; font-size: 14px;">
            <b>LAT:</b> <span id="lat">0</span><br>
            <b>LNG:</b> <span id="lng">0</span>
        </div>

        <button class="btn-save" onclick="saveCoordinates()">
            Підтвердити адресу
        </button>
    </div>

    <div id="map"></div>

    <script>

        const geoapifyKey = '5b30df56549e4a32b2bbcb8b53cd3c4c';
        const map = L.map('map', {
            zoomControl: false
        }).setView([50.4501, 30.5234], 13);

        L.control.zoom({
            position: 'bottomright'
        }).addTo(map);

        // 1. ІНТЕГРАЦІЯ КАРТИ (Leaflet + Geoapify)
        L.tileLayer(`https://maps.geoapify.com/v1/tile/osm-bright/{z}/{x}/{y}.png?apiKey=${geoapifyKey}`, {
            attribution: 'Powered by <a href="https://www.geoapify.com/" target="_blank">Geoapify</a> | <a href="https://openmaptiles.org/" target="_blank">© OpenMapTiles</a> <a href="https://www.openstreetmap.org/copyright" target="_blank">© OpenStreetMap</a>',
            maxZoom: 20
        }).addTo(map);

        let marker = L.marker([50.4501, 30.5234], { draggable: true }).addTo(map);

        function updateCoordinates(lat, lng) {
            document.getElementById("lat").innerText = lat.toFixed(5);
            document.getElementById("lng").innerText = lng.toFixed(5);
        }

        updateCoordinates(50.4501, 30.5234);

        map.on('click', function (e) {
            marker.setLatLng(e.latlng);
            updateCoordinates(e.latlng.lat, e.latlng.lng);
        });

        marker.on('dragend', function () {
            const pos = marker.getLatLng();
            updateCoordinates(pos.lat, pos.lng);
        });

        // 2. НОВА ЛОГІКА ЗБЕРЕЖЕННЯ (Відправка прямо в Avalonia)
        async function saveCoordinates() {
            const lat = document.getElementById("lat").innerText;
            const lng = document.getElementById("lng").innerText;

            // Запит на зворотне геокодування (Reverse Geocoding)
            const geoUrl = `https://api.geoapify.com/v1/geocode/reverse?lat=${lat}&lon=${lng}&lang=uk&format=json&limit=5&apiKey=${geoapifyKey}`;

            try {
                // Змінюємо текст кнопки, щоб юзер бачив, що йде загрузка
                const btn = document.querySelector('.btn-save');
                const oldText = btn.innerText;
                btn.innerText = "Пошук адреси...";
                btn.disabled = true;

                const response = await fetch(geoUrl);
                const data = await response.json();

                // розумний пошук адреси з номером будинку
                let finalAddress = "Адреса не знайдена";
                const exactAddress = data.results.find(r => r.street && r.housenumber);

                if (exactAddress) {
                    finalAddress = `${exactAddress.street}, ${exactAddress.housenumber}`;
                } else if (data.results.length > 0) {
                    finalAddress = data.results[0].formatted;
                }

                // Передача адреси назад у Avalonia
                if (window.chrome && window.chrome.webview) {
                    window.chrome.webview.postMessage(finalAddress);
                } else {
                    alert("Цей текст полетить в Avalonia:\n" + finalAddress);
                }

                // Повертаємо кнопку в нормальний стан
                btn.innerText = oldText;
                btn.disabled = false;

            } catch (err) {
                alert("Помилка з'єднання з картою: " + err.message);
                document.querySelector('.btn-save').disabled = false;
                document.querySelector('.btn-save').innerText = "Підтвердити адресу";
            }
        }
    </script>
</body>
</html>
