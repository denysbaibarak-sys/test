<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Велике зображення з Pinterest</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0;
        }

        .image-container {
            max-width: 1200px; 
            width: 100%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
            background-color: #fff;
        }

        .pinterest-img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div class="image-container">
        <img class="pinterest-img" src="https://i.pinimg.com/736x/db/bb/b9/dbbbb9f380daaf2ded1763c248424ef3.jpg" alt="Посхалко1488">
    </div>

</body>
</html>
